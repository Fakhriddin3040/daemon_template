# Deliberately readable by BOTH uv and poetry:
#   * `[project]` + `[dependency-groups]` (PEP 621 / PEP 735) is what uv reads.
#   * `[tool.poetry.group.*]` mirrors the same groups for poetry.
#   * `requirements/*.txt` is exported from these for plain pip.
# Whichever tool a fork prefers, the dependency set is the same one.

[project]
name = "daemon_template"
version = "0.1.0"
description = "Base daemon project: a supervised asyncio service runner with SQLAlchemy + Postgres + Redis and telemetry. No API, no domain."
authors = [
    { name = "Fakhriddin", email = "fahriddin3040@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    # data
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.3.0,<4.0.0)",
    "alembic (>=1.14.0,<2.0.0)",
    # serialization / config
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "msgspec (>=0.20.0,<0.21.0)",
    # composition
    "dependency-injector (>=4.48.3,<5.0.0)",
    # security
    "cryptography (>=45.0.5,<46.0.0)",
    # infrastructure
    "redis (>=5.2.1,<6.0.0)",
    "hiredis (>=3.4.1,<4.0.0)",
    # telemetry (Telegram writer)
    "httpx (>=0.28.1,<0.29.0)",
    # misc
    "regex (>=2025.11.3,<2026.0.0)",
    "pytz (>=2025.1,<2026.0)",
    "typing-extensions (>=4.12.0,<5.0.0)",
]

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=6.0.0,<8.0.0)",
]
dev = [
    "ruff (>=0.15.22)",
    "black (>=26.3.1)",
    "mypy (>=1.19.1,<2.0.0)",
    "pre-commit (>=4.0.0,<6.0.0)",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["**/tests*", "**/migrations*", "**/__pycache__*"]

# ----------------------------------------------------------------------------
# poetry mirror of the groups above
# ----------------------------------------------------------------------------
[tool.poetry]
package-mode = false

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
pytest-cov = ">=6.0.0,<8.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.22"
black = ">=26.3.1"
mypy = ">=1.19.1,<2.0.0"
pre-commit = ">=4.0.0,<6.0.0"
poetry-plugin-export = ">=1.10.0,<2.0.0"

# ----------------------------------------------------------------------------
# tooling
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Correctness rules only. `UP` (pyupgrade) and `I` (import sorting) are left off
# deliberately: the codebase writes `Optional[X]` / `typing.List` and groups its
# imports by hand, and turning those on would flag ~800 stylistic differences
# that say nothing about whether the code works. Turn them on in a fork if that
# fork wants to commit to the rewrite.
select = ["E", "F", "B"]
ignore = [
    # Line length is the formatter's job, not the linter's.
    "E501",
    # dependency-injector is built on call-in-default (`Provide[...]`), which is
    # exactly what B008 exists to catch in ordinary code.
    "B008",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
