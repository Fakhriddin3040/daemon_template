# In-network coordinates are set here, not in .env: inside the compose network
# every service is reachable at its standard port, so POSTGRES_HOST/PORT and
# REDIS_HOST/PORT are overridden for the containers. The values in .env describe
# the *host* side — where each service is published and how you reach it from
# your machine.
services:
  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEMETRY_SERVICE: daemon
    volumes:
      - .:/app
      # Shared with the telemetry service: the telemetry daemon tails what this one writes.
      - logs:/app/logs

  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TELEMETRY_SERVICE: telemetry
    volumes:
      - .:/app
      - logs:/app/logs

  db:
    build:
      context: postgres
      dockerfile: ./Dockerfile

    env_file: [.env]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./logs/db:/logs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
